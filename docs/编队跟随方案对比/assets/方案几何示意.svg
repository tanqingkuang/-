<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker>
    <style>.title{font-family:'Microsoft YaHei';font-size:26px;font-weight:700;fill:#172033}.subtitle{font-family:'Microsoft YaHei';font-size:18px;font-weight:600;fill:#334155}.label{font-family:'Microsoft YaHei';font-size:16px;fill:#334155}.small{font-family:'Microsoft YaHei';font-size:14px;fill:#475569}.formula{font-family:'Microsoft YaHei';font-size:17px;font-weight:600;fill:#172033}</style>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/><text x="600" y="38" text-anchor="middle" class="title">转弯时：空间队形跟随与航线里程跟随</text>
  <rect x="24" y="58" width="558" height="568" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="303" y="94" text-anchor="middle" class="title">空间队形跟随</text><text x="303" y="122" text-anchor="middle" class="subtitle">目标 = 长机位置 + 切线方向前移 a</text>
  <circle cx="300" cy="360" r="180" fill="none" stroke="#2563eb" stroke-width="4"/><circle cx="300" cy="360" r="266" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="10 8"/><circle cx="300" cy="360" r="6" fill="#172033"/><text x="285" y="350" text-anchor="end" class="label">规划圆心 C</text><line x1="300" y1="360" x2="456" y2="450" stroke="#2563eb" stroke-width="2"/><text x="373" y="422" class="formula">R</text><circle cx="456" cy="450" r="11" fill="#2563eb"/><text x="440" y="478" text-anchor="middle" class="label">长机</text><line x1="456" y1="450" x2="504" y2="368" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-orange)"/><text x="496" y="422" class="formula">空间槽位 a</text><circle cx="504" cy="368" r="11" fill="#ea580c"/><text x="522" y="360" class="label">前方僚机</text><path d="M440 427 L472 372" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="420" y="386" class="small">长机切线方向</text>
  <rect x="68" y="536" width="470" height="68" rx="10" fill="#fff7ed" stroke="#fdba74"/><text x="303" y="562" text-anchor="middle" class="formula">僚机半径 ρ = √(R² + a²) ＞ R</text><text x="303" y="588" text-anchor="middle" class="label">保持刚性空间槽位，但前方僚机机动更大</text>
  <rect x="618" y="58" width="558" height="568" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="897" y="94" text-anchor="middle" class="title">航线里程跟随</text><text x="897" y="122" text-anchor="middle" class="subtitle">目标 = 航线上公共里程前方 a 米</text>
  <circle cx="900" cy="360" r="180" fill="none" stroke="#2563eb" stroke-width="4"/><circle cx="900" cy="360" r="6" fill="#172033"/><text x="885" y="350" text-anchor="end" class="label">规划圆心 C</text><line x1="900" y1="360" x2="1056" y2="450" stroke="#2563eb" stroke-width="2"/><line x1="900" y1="360" x2="1080" y2="354" stroke="#2563eb" stroke-width="2"/><text x="974" y="421" class="formula">R</text><text x="990" y="348" class="formula">R</text><circle cx="1056" cy="450" r="11" fill="#2563eb"/><text x="1043" y="480" text-anchor="middle" class="label">长机</text><path d="M1056 450 A180 180 0 0 0 1080 354" fill="none" stroke="#ea580c" stroke-width="7" marker-end="url(#arrow-orange)"/><text x="1110" y="414" class="formula">航线里程 a</text><circle cx="1080" cy="354" r="11" fill="#ea580c"/><text x="1095" y="342" class="label">前方僚机</text>
  <rect x="662" y="536" width="470" height="68" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="897" y="562" text-anchor="middle" class="formula">长机和僚机半径相同：ρ = R</text><text x="897" y="588" text-anchor="middle" class="label">保持航线里程差，转弯时允许空间队形变形</text><text x="600" y="638" text-anchor="middle" class="small">直线段两种方案一致；a/R 越大，弯道差异越明显。</text>
</svg>
